name: Build test and deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    - name: Install node packages      
      run: npm install
    - name: Replace config.js to local settings
      run:
        echo "export const settings = {host:'http//localhost:3030'}" >src/config.js 
    - name: Run Back End  
      run: npm run server &
    - name: Run Front End
      run: npm run start &
    - name: Install Playwright
      run: npx playwright install
    - name: Run test  
      run: npm test
